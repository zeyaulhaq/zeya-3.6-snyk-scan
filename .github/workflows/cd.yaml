name: CD - Deploy Lambda
run-name: Deploying Lambda via Terraform by ${{ github.actor }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # needed to request the OIDC token from GitHub
  contents: read    # needed to checkout the code

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Test - Invoke Lambda
        run: |
          FUNCTION_NAME=$(terraform output -raw lambda_function_name)
          echo "Invoking $FUNCTION_NAME..."
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --log-type Tail \
            --query 'LogResult' \
            --output text \
            response.json | base64 --decode
          echo ""
          echo "Response:"
          cat response.json

  summary:
    needs: [terraform-apply]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Adding markdown
        run: |
          echo '## 🚀 Deployment Summary 🚀' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo "| Job Name        | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| terraform-apply | ${{ needs.terraform-apply.outputs.status }} |" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '## Deployed by: ${{ github.actor }}' >> $GITHUB_STEP_SUMMARY